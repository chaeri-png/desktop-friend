# 맥용 설치 파일(dmg) 자동 빌드
# 사용법: GitHub 저장소 → Actions 탭 → "Mac 빌드 (dmg)" → Run workflow 버튼
name: Mac 빌드 (dmg)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    # 참고: 서명을 완전히 끄면 애플 실리콘 맥이 앱을 "악성 코드"로 판정해 휴지통으로 보낸다.
    # electron-builder가 기본으로 해주는 약식(ad-hoc) 서명을 그대로 두면 정상 설치된다.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 의존성 설치
        run: npm ci
      - name: 아이콘 생성
        run: npm run icons
      - name: dmg 빌드
        # --publish never: CI에서 릴리스 자동 게시 시도 안 함 (dmg 파일만 생성)
        run: npm run dist:mac -- --publish never
      - name: dmg 업로드
        uses: actions/upload-artifact@v4
        with:
          name: Desktop-friend-by-chaeri-mac
          path: release/*.dmg
